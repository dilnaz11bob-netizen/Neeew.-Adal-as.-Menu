<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAL-AS — Онлайн меню</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600;700&display=swap');

    :root {
      --bg-cream: #F7F3EE;
      --card-bg: #FFFFFF;
      --dark-green: #0A3225;
      --accent-gold: #D4AF37;
      --accent-gold-light: #E6C875;
      --light-beige: #F3E5D8;
      --text-dark: #1A2621;
      --text-gray: #7A8A84;
      --accent-green: #25D366;
      --border-color: #E8DEC8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 0 35px rgba(10, 50, 37, 0.15);
      position: relative;
      min-height: 100vh;
    }

    /* Приветственный экран */
    #welcomeScreen {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: radial-gradient(circle, #0F4534 0%, var(--dark-green) 100%);
      color: var(--light-beige);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      z-index: 1000;
      text-align: center;
    }

    .brand-ornament { 
      font-size: 32px; 
      color: var(--accent-gold); 
      margin-bottom: 12px;
      letter-spacing: 6px;
    }

    .brand-title { 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 44px; 
      font-weight: 700; 
      letter-spacing: 5px; 
      color: var(--light-beige); 
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .brand-subtitle { 
      font-size: 12px; 
      letter-spacing: 6px; 
      color: var(--accent-gold); 
      margin: 8px 0 20px; 
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
      color: var(--dark-green);
      border: none;
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      margin-top: 25px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    #mainContent { display: none; padding-bottom: 110px; }

    /* Шапка сайта */
    header {
      text-align: center;
      padding: 24px 20px 14px;
      background: var(--dark-green);
      color: var(--light-beige);
      position: relative;
    }

    .header-ornament {
      color: var(--accent-gold);
      font-size: 16px;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }

    .logo { 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 34px; 
      font-weight: 700; 
      color: var(--light-beige); 
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* Поиск */
    .search-container {
      background: var(--dark-green);
      padding: 8px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 12;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      font-size: 16px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 13px 44px 13px 44px;
      border-radius: 30px;
      border: 1.5px solid var(--accent-gold);
      background: #FFFFFF;
      font-size: 14px;
      outline: none;
      color: var(--text-dark);
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      transition: border-color 0.2s ease;
    }

    .search-input::placeholder {
      color: #8C9994;
    }

    .search-input:focus {
      border-color: var(--accent-gold-light);
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.25);
    }

    .clear-search-btn {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: #8C9994;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: background-color 0.2s, color 0.2s;
    }

    .clear-search-btn:hover {
      color: var(--dark-green);
      background: rgba(0,0,0,0.05);
    }

    /* Категории */
    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 16px 16px;
      background: var(--dark-green);
      position: sticky;
      top: 61px;
      z-index: 11;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: transparent;
      color: var(--light-beige);
      border: 1px solid var(--accent-gold);
      padding: 8px 18px;
      border-radius: 22px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
      color: var(--dark-green);
      font-weight: 700;
      border-color: var(--accent-gold);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }

    /* Карточки блюд */
    .menu-container { padding: 18px 16px; }

    .menu-item {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px rgba(10, 50, 37, 0.04);
      position: relative;
      overflow: hidden;
    }

    .menu-item::before {
      content: "❖";
      position: absolute;
      top: -6px;
      right: 12px;
      font-size: 18px;
      color: rgba(212, 175, 55, 0.15);
      pointer-events: none;
    }

    .item-info { flex: 1; padding-right: 12px; }

    .item-category-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .item-category-tag::before {
      content: "◇";
      font-size: 9px;
    }

    .item-name { 
      font-size: 16px; 
      font-weight: 700; 
      color: var(--text-dark); 
      margin-bottom: 4px; 
    }

    .item-keywords {
      font-size: 12px;
      color: var(--text-gray);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .item-price { 
      color: var(--dark-green); 
      font-weight: 700; 
      font-size: 18px; 
      font-family: 'Cormorant Garamond', serif; 
    }

    .btn-add {
      background: var(--dark-green);
      color: var(--light-beige);
      border: 1px solid var(--accent-gold);
      padding: 9px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(10, 50, 37, 0.15);
    }

    .btn-add:active {
      transform: scale(0.95);
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-cream);
      border: 1px solid var(--accent-gold);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .btn-cnt { 
      background: transparent; 
      border: none; 
      color: var(--dark-green); 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
    }

    /* Нижняя панель */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: var(--dark-green);
      border-top: 2px solid var(--accent-gold);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
    }

    .bar-text { font-size: 12px; color: var(--light-beige); }
    .bar-total { font-size: 22px; font-weight: 700; color: var(--accent-gold); font-family: 'Cormorant Garamond', serif; }

    .btn-cart {
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
      color: var(--dark-green);
      border: none;
      padding: 11px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* Модальное окно */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 50, 37, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--bg-cream);
      width: 100%;
      max-width: 500px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
      border-top: 3px solid var(--accent-gold);
      box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .modal-header h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--dark-green);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .input-field {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 13px 16px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-gold);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 15px;
      margin-top: 18px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    .btn-close {
      width: 100%;
      background: transparent;
      color: var(--text-gray);
      border: none;
      padding: 12px;
      margin-top: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .container-fee-note {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 10px;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Экран приветствия -->
  <div id="welcomeScreen">
    <div class="brand-ornament">❖ ◈ ❖</div>
    <div class="brand-title">ADAL-AS</div>
    <div class="brand-subtitle">КАФЕ / КӘФЕСІ</div>
    <button class="btn-start" onclick="enterMenu()">Начать заказ</button>
  </div>

  <!-- Главный интерфейс -->
  <div id="mainContent">
    <header>
      <div class="header-ornament">❖ ◈ ❖</div>
      <div class="logo">Адал ас</div>
    </header>

    <!-- Поиск -->

      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск (напр. баклажан, чай, кола)..." oninput="handleSearch()">
        <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" title="Очистить поиск">✖</button>
      </div>
    </div>

    <div class="categories" id="categoryList"></div>
    <div class="menu-container" id="menu"></div>

    <div class="bottom-bar" id="bottomBar" style="display: none;">
      <div>
        <div class="bar-text">Выбрано: <span id="cartCount">0</span> поз.</div>
        <div class="bar-total" id="cartTotal">0 ₸</div>
      </div>
      <button class="btn-cart" onclick="openCart()">Посмотреть корзину</button>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="cartModal">
      <div class="modal-content" id="modalStep1">
        <div class="modal-header">
          <h3>Ваша корзина</h3>
          <button style="color: #D9534F; background:none; border:none; cursor:pointer; font-weight:600;" onclick="clearCart()">Очистить</button>
        </div>
        <div id="cartList"></div>
        <div class="container-fee-note" id="containerFeeNote"></div>
        <div style="margin-top: 15px; text-align: right; font-weight: bold; font-size: 22px; color: var(--dark-green); font-family: 'Cormorant Garamond', serif;" id="cartModalTotal"></div>
        <button class="btn-submit" style="background: var(--dark-green);" onclick="goToCheckout()">Перейти к оформлению</button>
        <button class="btn-close" onclick="closeCart()">Продолжить выбор</button>
      </div>

      <div class="modal-content" id="modalStep2" style="display: none;">
        <div class="modal-header">
          <h3>Детали доставки</h3>
        </div>
        <input type="text" id="street" class="input-field" placeholder="Улица и номер дома *">
        <input type="text" id="flat" class="input-field" placeholder="Квартира / офис / подъезд *">
        <input type="text" id="floor" class="input-field" placeholder="Этаж *">
        <input type="text" id="comment" class="input-field" placeholder="Комментарий к заказу">
        
        <button class="btn-submit" onclick="sendToWhatsApp()">💬 Отправить в WhatsApp</button>
        <button class="btn-close" onclick="backToCart()">Назад в корзину</button>
      </div>
    </div>
  </div>

    function renderCategories() {
      const categories = ["Все", ...new Set(products.map(p => p.category))];
      const container = document.getElementById('categoryList');
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      renderCategories();
      renderMenu();
    }

    function renderMenu(items = null) {
      const menuContainer = document.getElementById('menu');
      let list = items;

      if (!list) {
        list = activeCategory === "Все" 
          ? products 
          : products.filter(p => p.category === activeCategory);
      }

      if (list.length === 0) {
        menuContainer.innerHTML = `<div style="text-align:center; color: var(--text-gray); padding: 40px 0;">Ничего не найдено</div>`;
        return;
      }

      menuContainer.innerHTML = list.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="menu-item">
            <div class="item-info">
              <div class="item-category-tag">${item.category}</div>
              <div class="item-name">${item.name}</div>
              <div class="item-price">${item.price} ₸</div>
            </div>
            <div>
              ${qty === 0 ? `
                <button class="btn-add" onclick="changeQty(${item.id}, 1)">+ Добавить</button>
              ` : `
                <div class="counter">
                  <button class="btn-cnt" onclick="changeQty(${item.id}, -1)">-</button>
                  <span style="font-weight: bold; font-size: 14px;">${qty}</span>
                  <button class="btn-cnt" onclick="changeQty(${item.id}, 1)">+</button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const clearBtn = document.getElementById('clearSearchBtn');

      if (query.length > 0) {
        clearBtn.style.display = 'flex';
        const filtered = products.filter(p => {
          const matchName = p.name.toLowerCase().includes(query);
          const matchCategory = p.category.toLowerCase().includes(query);
          const matchKeywords = p.keywords && p.keywords.some(k => k.toLowerCase().includes(query));
          return matchName || matchCategory || matchKeywords;
        });
        renderMenu(filtered);
      } else {
        clearBtn.style.display = 'none';
        renderMenu();
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      renderMenu();
    }

    function changeQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      
      const query = document.getElementById('searchInput').value.trim();
      if (query.length > 0) {
        handleSearch();
      } else {
        renderMenu();
      }
      
      updateBottomBar();
    }

    function updateBottomBar() {
      const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
      const bottomBar = document.getElementById('bottomBar');

      if (totalItems > 0) {
        bottomBar.style.display = 'flex';
        document.getElementById('cartCount').innerText = totalItems;
        
        let subtotal = 0;
        let containerCount = 0;

        Object.keys(cart).forEach(id => {
          const item = products.find(p => p.id == id);
          const qty = cart[id];
          subtotal += item.price * qty;
          if (!item.freeContainer) {
            containerCount += qty;
          }
        });

        const containerTotal = containerCount * CONTAINER_PRICE;
        const grandTotal = subtotal + containerTotal;

        document.getElementById('cartTotal').innerText = `${grandTotal} ₸`;
      } else {
        bottomBar.style.display = 'none';
      }
    }

    function openCart() {
      const modal = document.getElementById('cartModal');
      const cartList = document.getElementById('cartList');
      const containerFeeNote = document.getElementById('containerFeeNote');
      
      let html = '';
      let subtotal = 0;
      let containerCount = 0;

      Object.keys(cart).forEach(id => {
        const item = products.find(p => p.id == id);
        const qty = cart[id];
        const itemSum = item.price * qty;
        subtotal += itemSum;

        if (!item.freeContainer) {
          containerCount += qty;
        }

        html += `
          <div class="cart-item">
            <div>
              <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
              <div style="font-size: 12px; color: var(--text-gray);">${item.price} ₸ × ${qty} = ${itemSum} ₸</div>
            </div>
            <div class="counter">
              <button class="btn-cnt" onclick="changeQtyCart(${id}, -1)">-</button>
              <span style="font-weight: bold; font-size: 14px;">${qty}</span>
              <button class="btn-cnt" onclick="changeQtyCart(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      const containerTotal = containerCount * CONTAINER_PRICE;
      const grandTotal = subtotal + containerTotal;

      cartList.innerHTML = html;
      
      if (containerCount > 0) {
        containerFeeNote.innerText = `+ Контейнеры (${containerCount} шт × ${CONTAINER_PRICE} ₸ = ${containerTotal} ₸)`;
      } else {
        containerFeeNote.innerText = '';
      }

      document.getElementById('cartModalTotal').innerText = `Итого: ${grandTotal} ₸`;
      
      document.getElementById('modalStep1').style.display = 'block';
      document.getElementById('modalStep2').style.display = 'none';
      modal.style.display = 'flex';
    }

    function changeQtyCart(id, delta) {
      changeQty(id, delta);
      if (Object.keys(cart).length === 0) {
        closeCart();
      } else {
        openCart();
      }
    }

    function clearCart() {
      cart = {};
      updateBottomBar();
      renderMenu();
      closeCart();
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function goToCheckout() {
      document.getElementById('modalStep1').style.display = 'none';
      document.getElementById('modalStep2').style.display = 'block';
    }

    function backToCart() {
      document.getElementById('modalStep1').style.display = 'block';
      document.getElementById('modalStep2').style.display = 'none';
    }

    function sendToWhatsApp() {
      const street = document.getElementById('street').value.trim();
      const flat = document.getElementById('flat').value.trim();
      const floor = document.getElementById('floor').value.trim();
      const comment = document.getElementById('comment').value.trim();

      if (!street || !flat || !floor) {
        alert("Пожалуйста, заполните обязательные поля адреса (Улица, Квартира, Этаж)");
        return;
      }

      let text = "🍽️ *НОВЫЙ ЗАКАЗ (ADAL-AS)*\n\n";
      let subtotal = 0;
      let containerCount = 0;

      Object.keys(cart).forEach(id => {
        const item = products.find(p => p.id == id);
        const qty = cart[id];
        const itemSum = item.price * qty;
        subtotal += itemSum;

        if (!item.freeContainer) {
          containerCount += qty;
        }

        text += `• ${item.name} — ${qty} шт. (${itemSum} ₸)\n`;
      });

      const containerTotal = containerCount * CONTAINER_PRICE;
      const grandTotal = subtotal + containerTotal;

      text += `\n📦 *Контейнеры:* ${containerCount} шт. (${containerTotal} ₸)`;
      text += `\n💰 *ИТОГО К ОПЛАТЕ:* ${grandTotal} ₸\n\n`;

      text += `📍 *Адрес доставки:*\n`;
      text += `• Улица, дом: ${street}\n`;
      text += `• Квартира/офис: ${flat}\n`;
      text += `• Этаж: ${floor}\n`;
      
      if (comment) {
        text += `💬 *Комментарий:* ${comment}\n`;
      }

      const encodedText = encodeURIComponent(text);
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
    }
  </script>
</body>
</html>
